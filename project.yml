name: OpenScreen
options:
  bundleIdPrefix: ai.openscreen
  deploymentTarget:
    macOS: "15.0"

packages:
  OpenScreenModules:
    path: ./

targets:
  OpenScreen:
    type: application
    platform: macOS
    sources:
      - path: App/OpenScreenApp
    dependencies:
      - package: OpenScreenModules
        product: AppFeature
    info:
      path: App/OpenScreenApp/Info.plist
      properties:
        CFBundleName: OpenScreen
        CFBundleDisplayName: OpenScreen
        LSMinimumSystemVersion: "15.0"
        NSScreenCaptureUsageDescription: "OpenScreen records your screen so you can create polished videos."
        NSCameraUsageDescription: "OpenScreen records your camera for the picture-in-picture overlay."
        NSMicrophoneUsageDescription: "OpenScreen records your microphone audio alongside the screen."
        NSSpeechRecognitionUsageDescription: "OpenScreen transcribes your narration into captions."
    entitlements:
      path: App/OpenScreenApp/OpenScreen.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.openscreen.app
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: App/OpenScreenApp/OpenScreen.entitlements
        CODE_SIGN_STYLE: Automatic

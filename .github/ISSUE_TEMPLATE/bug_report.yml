name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Record an iPhone…
        2. Click…
        3. See…
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Recording type
      options:
        - iPhone or iPad
        - Mac display or window
        - Not related to recording
  - type: input
    id: version
    attributes:
      label: OpenScreen version
      description: OpenScreen › About OpenScreen
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.0"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, a screen recording, or logs help a lot.

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenScreen</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: -apple-system, system-ui, sans-serif;
        background: #1a1a1e; color: #eee;
        height: 100vh; overflow: hidden;
      }
      #root { height: 100%; }
      .app { display: flex; flex-direction: column; height: 100%; padding: 20px; gap: 14px; }
      .sources { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; overflow-y: auto; }
      .source { background: #26262c; border: 2px solid transparent; border-radius: 10px; padding: 8px; cursor: pointer; text-align: left; color: inherit; }
      .source.selected { border-color: #6c5ce7; }
      .source img { width: 100%; border-radius: 6px; display: block; }
      .source .name { font-size: 12px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      button.primary { background: #6c5ce7; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
      button.primary:disabled { opacity: 0.4; cursor: default; }
      .rec-hud { display: flex; align-items: center; gap: 12px; }
      .rec-dot { width: 12px; height: 12px; border-radius: 50%; background: #e74c3c; animation: pulse 1s infinite alternate; }
      @keyframes pulse { to { opacity: 0.3; } }
      .editor { display: flex; gap: 10px; flex: 1; min-height: 0; }
      .ed-main { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }
      .preview-wrap { flex: 1; min-height: 0; max-height: 58vh; display: flex; align-items: center; justify-content: center; }
      canvas.preview { max-width: 100%; max-height: 100%; border-radius: 8px; }
      .timeline { height: 64px; background: #26262c; border-radius: 8px; position: relative; cursor: pointer; }
      .timeline .wave { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .timeline .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; }
      .timeline .zoommark { position: absolute; top: 26px; width: 8px; height: 8px; background: #fdcb6e; transform: rotate(45deg); border-radius: 1px; }
      .timeline .clipblock { position: absolute; top: 4px; height: 18px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15); border-radius: 3px; box-sizing: border-box; }
      .timeline .clipblock.selected { background: rgba(109,140,220,.4); border-color: #6d8ce0; }
      .timeline .clipblock[draggable=true] { cursor: grab; }
      .transcript { width: 250px; overflow-y: auto; background: #26262c; border-radius: 8px; padding: 8px; font-size: 12px; flex-shrink: 0; }
      .transcript h3 { margin: 2px 4px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #888; font-weight: 600; }
      .cue { padding: 4px 6px; border-radius: 4px; cursor: pointer; display: flex; gap: 6px; align-items: baseline; }
      .cue:hover { background: rgba(255,255,255,.06); }
      .cue .t { color: #888; font-variant-numeric: tabular-nums; flex-shrink: 0; }
      .cue .x { margin-left: auto; color: #666; padding: 0 3px; }
      .cue .x:hover { color: #e74c3c; }
      .transcript .cutall { margin: 2px 4px 8px; font-size: 11px; }
      .panel { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
      .panel label { font-size: 12px; color: #aaa; display: flex; gap: 6px; align-items: center; }
      .panel input[type=range] { width: 110px; }
      .swatches { display: flex; gap: 6px; }
      .sliders { display: flex; gap: 14px; }
      .sliders label { flex-direction: column; align-items: flex-start; gap: 2px; }
      .sliders input[type=range] { width: 90px; }
      .swatch { width: 28px; height: 28px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; padding: 0; }
      .swatch.selected { border-color: #fff; }
      .status { font-size: 12px; color: #888; }
      .permwarn { background: rgba(220,130,60,.14); border: 1px solid rgba(220,130,60,.45); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #e8b080; }
      .permwarn button { margin-left: 8px; }
      .countdown { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 140px; font-weight: 800; color: #fff; background: rgba(0,0,0,.55); z-index: 10; text-shadow: 0 4px 40px rgba(0,0,0,.6); }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
